[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitrag-backend"
version = "0.1.0"
description = "GaitRAG backend: gait feature extraction, speed classifier and evidence-grounded RAG."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.20",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "scipy>=1.13,<2.0",
    # Pinned exactly: the saved model (joblib/pickle) must be loaded with the
    # same scikit-learn version that trained it.
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]
# E501 (line length) is left to black.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
